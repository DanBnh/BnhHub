<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
<title id="title">Personagem cyberpunk BnhHub</title>
<desc id="desc">Personagem futurista original com roupa preta, visor e detalhes verde neon.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030608"/><stop offset=".55" stop-color="#071112"/><stop offset="1" stop-color="#06140d"/></linearGradient>
  <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#222b2d"/><stop offset=".45" stop-color="#080d0f"/><stop offset="1" stop-color="#111719"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39ff00"/><stop offset="1" stop-color="#00d66b"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#123" stroke-opacity=".32"/></pattern>
</defs>
<rect width="900" height="1100" fill="url(#bg)"/>
<rect width="900" height="1100" fill="url(#grid)" opacity=".65"/>
<ellipse cx="470" cy="780" rx="290" ry="120" fill="#39ff00" opacity=".10" filter="url(#soft)"/>
<!-- neon city traces -->
<g stroke="#39ff00" stroke-opacity=".55" fill="none"><path d="M50 860H310l70-70h150l90-90h230"/><path d="M20 930h250l55-55h170l75-75h290"/></g>
<!-- legs -->
<path d="M365 690l-18 220-54 125 105 0 44-129 30-180z" fill="#090e10" stroke="#303a3c" stroke-width="8"/>
<path d="M505 700l58 205 100 108-93 26-95-111-35-197z" fill="#0a0f11" stroke="#303a3c" stroke-width="8"/>
<path d="M291 1035h105l-8 30H270zM570 1010l95 3 33 39H578z" fill="#050708" stroke="#39ff00" stroke-width="5"/>
<!-- torso coat -->
<path d="M310 390Q445 325 570 395l95 330-155 105-210-115z" fill="url(#coat)" stroke="#3a4446" stroke-width="10"/>
<path d="M355 414l45 390M545 414l-42 406" stroke="#39ff00" stroke-width="7" opacity=".8" filter="url(#glow)"/>
<path d="M330 570h280M350 635h250" stroke="#182124" stroke-width="18"/>
<path d="M420 435h92v190h-92z" fill="#030607" stroke="#39ff00" stroke-width="5" opacity=".9"/>
<!-- arms -->
<path d="M320 430Q270 450 230 555l-78 158 75 35 105-160 63-100z" fill="#0b1012" stroke="#3a4446" stroke-width="9"/>
<path d="M572 430q70 20 103 125l70 160-75 30-94-153-54-104z" fill="#0b1012" stroke="#3a4446" stroke-width="9"/>
<path d="M176 704l-36 73 54 32 39-70zM675 716l40 66-51 34-44-67z" fill="#151d20" stroke="#39ff00" stroke-width="5"/>
<!-- neck -->
<path d="M397 340v75q45 38 92 0v-75z" fill="#111719" stroke="#343d40" stroke-width="8"/>
<!-- head/helmet -->
<path d="M335 160Q450 78 565 165l27 175-72 82-119-10-84-83z" fill="#111719" stroke="#465154" stroke-width="10"/>
<path d="M352 204Q450 150 548 207l-13 92q-88 43-174-2z" fill="#030607" stroke="#39ff00" stroke-width="8"/>
<path d="M370 242h158" stroke="#39ff00" stroke-width="13" filter="url(#glow)"/>
<path d="M388 340l-25 65M525 338l28 63" stroke="#39ff00" stroke-width="6"/>
<path d="M360 174l-31-37M540 175l35-38" stroke="#596365" stroke-width="13"/>
<!-- shoulder neon plates -->
<path d="M310 425l-72 32 25 68 82-40zM590 425l76 32-26 68-84-40z" fill="#151e20" stroke="#39ff00" stroke-width="6"/>
<!-- chest insignia -->
<circle cx="466" cy="530" r="28" fill="#050708" stroke="#39ff00" stroke-width="5"/><path d="M451 530h30M466 515v30" stroke="#39ff00" stroke-width="4"/>
<!-- floating particles -->
<g fill="#39ff00"><circle cx="150" cy="330" r="3"/><circle cx="705" cy="290" r="4"/><circle cx="735" cy="510" r="2"/><circle cx="110" cy="580" r="2"/><circle cx="755" cy="820" r="3"/></g>
</svg>
